<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AuraBrain · 本机能力</title>
<style>
:root{--bg:#0d1211;--panel:#151c19;--field:#0b110f;--line:#2b3933;--text:#eef3ed;--muted:#9daaa1;--lime:#c8f169;--ink:#18220f;--red:#ff9c8f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 0,#28453b 0,transparent 28%),linear-gradient(135deg,#0d1211,#111b17 60%,#0b1110);color:var(--text);font:13px 'Aptos','Segoe UI','Microsoft YaHei',sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:26px 16px;border-right:1px solid var(--line);background:#0c1210b8}.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 10px 42px}.brand i{display:grid;place-items:center;width:31px;height:31px;border:1px solid #c8f16988;border-radius:9px;color:var(--lime);font-style:normal}.nav-title{color:#68766d;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:22px 11px 9px}.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:7px;background:transparent;color:var(--muted);padding:10px 11px;text-align:left;cursor:pointer;font:inherit}.nav.active,.nav:hover{background:#c8f16916;color:var(--lime)}.nav span{width:18px}.side-foot{position:absolute;bottom:23px;color:#68766d;font-size:11px;padding:0 11px}.main{width:min(900px,calc(100% - 48px));margin:0 auto;padding:58px 0 70px}.eyebrow{color:var(--lime);font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:9px}.top h1{font-size:29px;margin:0 0 8px}.top p{color:var(--muted);margin:0 0 28px}.panel{background:#131b18e8;border:1px solid var(--line);border-radius:12px;padding:21px;box-shadow:0 20px 60px #00000025;margin-bottom:16px}.panel h2{font-size:16px;margin:0 0 7px}.desc{color:var(--muted);margin:0 0 18px;line-height:1.6}.cap{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:17px 0;border-top:1px solid var(--line)}.cap:first-of-type{border-top:0}.cap strong{display:block;font-size:14px;margin-bottom:5px}.cap small{color:var(--muted)}.controls{display:flex;align-items:center;gap:10px}.switch{position:relative;width:42px;height:24px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#34413a;border-radius:20px;cursor:pointer}.slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#eef3ed;border-radius:50%;transition:.15s}.switch input:checked+.slider{background:var(--lime)}.switch input:checked+.slider:before{transform:translateX(18px);background:var(--ink)}select{background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}.save{border:0;border-radius:7px;background:var(--lime);color:var(--ink);padding:11px 17px;font:inherit;font-weight:700;cursor:pointer}.status{min-height:20px;color:var(--muted);margin-top:14px}.status.ok{color:var(--lime)}.status.error{color:var(--red)}.readonly{color:#9daaa1;font-size:12px;line-height:1.6}
</style><style>.nav div{display:flex;flex-direction:column;gap:2px}.nav strong{font-weight:500}.nav small{color:#68766d;font-size:10px}.nav.active small,.nav:hover small{color:inherit}</style></head>
<body><div class="app"><aside class="side"><div class="brand"><i>✦</i>AuraBrain</div><div class="nav-title">Workspace</div><button class="nav" onclick="location.href='/'"><span>◌</span>模型测试</button><div class="nav-title">Settings</div><button class="nav" onclick="location.href='/aurabrain/settings/models'"><span>⚙</span>模型工作台</button><button class="nav active"><span>◫</span>本机能力</button><button class="nav" onclick="location.href='/setup'"><span>?</span>初始化引导</button><div class="side-foot">Local Runtime · 49000</div></aside><main class="main"><div class="eyebrow">Settings / Capabilities</div><header class="top"><h1>本机能力</h1><p>邮件和日程当前只允许读取，不提供发送、新建、修改或删除操作。</p></header><section class="panel"><h2>数据来源</h2><p class="desc">默认使用当前 Windows 用户的经典 Outlook 本地数据。演示数据只用于界面联调，不会访问 Outlook。</p><div class="cap"><div><strong>邮件</strong><small>读取收件箱最近邮件和正文预览</small></div><div class="controls"><select id="mailMode"><option value="real">真实数据</option><option value="demo">演示数据</option></select><label class="switch"><input id="mailEnabled" type="checkbox"><span class="slider"></span></label></div></div><div class="cap"><div><strong>日程</strong><small>读取未来日历事件、地点和会议链接</small></div><div class="controls"><select id="calendarMode"><option value="real">真实数据</option><option value="demo">演示数据</option></select><label class="switch"><input id="calendarEnabled" type="checkbox"><span class="slider"></span></label></div></div><button id="save" class="save">保存设置</button><div id="status" class="status"></div></section><section class="panel readonly"><strong>只读边界</strong><br>已实现：连接测试、邮件读取、日程读取。<br>未实现：发送邮件、新建邮件、回复、转发、新建日程、修改日程、删除日程。</section></main></div>
<script>
const menuItems=[['模型测试','验证当前模型是否可用','/'],['模型与连接','配置模型、接口和密钥','/aurabrain/settings/models'],['本机能力','邮件、日程和数据来源','/aurabrain/settings/capabilities'],['首次配置','重新打开初始化说明','/setup']];document.querySelectorAll('.side .nav').forEach((button,index)=>{const item=menuItems[index];if(!item)return;button.innerHTML='<span>'+button.querySelector('span').textContent+'</span><div><strong>'+item[0]+'</strong><small>'+item[1]+'</small></div>';button.onclick=()=>location.href=item[2]});
const $=id=>document.getElementById(id);async function load(){const r=await fetch('/v1/capabilities/settings');const d=await r.json();for(const key of ['mail','calendar']){$(key+'Enabled').checked=Boolean(d[key].enabled);$(key+'Mode').value=d[key].dataMode}}$('save').onclick=async()=>{const status=$('status');status.className='status';status.textContent='正在保存…';try{const r=await fetch('/v1/capabilities/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mail:{enabled:$('mailEnabled').checked,dataMode:$('mailMode').value},calendar:{enabled:$('calendarEnabled').checked,dataMode:$('calendarMode').value}})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'保存失败');status.className='status ok';status.textContent='设置已保存到本机'}catch(e){status.className='status error';status.textContent=e.message||String(e)}};load().catch(e=>$('status').textContent=e.message)
</script></body></html>
