<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AuraBrain Runtime</title>
<style>
:root{--bg:#0d1211;--panel:#151c19;--panel2:#101614;--line:#2b3933;--text:#eef3ed;--muted:#9daaa1;--lime:#c8f169;--limeInk:#18220f;--cyan:#8edbd0;--red:#ff9c8f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 0,#28453b 0,transparent 28%),linear-gradient(135deg,#0d1211,#111b17 60%,#0b1110);color:var(--text);font:13px 'Aptos','Segoe UI','Microsoft YaHei',sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:26px 16px;border-right:1px solid var(--line);background:#0c1210b8}.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 10px 42px}.brand i{display:grid;place-items:center;width:31px;height:31px;border:1px solid #c8f16988;border-radius:9px;color:var(--lime);font-style:normal}.nav-title{color:#68766d;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:22px 11px 9px}.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:7px;background:transparent;color:var(--muted);padding:10px 11px;text-align:left;cursor:pointer;font:inherit}.nav:hover,.nav.active{background:#c8f16916;color:var(--lime)}.nav span{width:18px;color:inherit}.side-foot{position:absolute;bottom:23px;color:#68766d;font-size:11px;padding:0 11px}.main{width:min(900px,calc(100% - 48px));margin:0 auto;padding:54px 0 80px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px}.eyebrow{color:var(--lime);font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px}.top h1{font-size:30px;margin:0 0 8px;letter-spacing:-.02em}.top p{color:var(--muted);margin:0}.model-select{background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:10px 12px;min-width:205px}.card{background:#131b18dd;border:1px solid var(--line);border-radius:12px;padding:25px;box-shadow:0 20px 60px #00000025}.card h2{margin:0 0 7px;font-size:18px}.desc{color:var(--muted);line-height:1.6;margin:0 0 22px}.drop{border:1px dashed #607c6d;border-radius:9px;min-height:180px;display:grid;place-items:center;text-align:center;background:#0b110f99;transition:.2s}.drop.over,.drop.has-image{border-color:var(--lime);background:#c8f1690c}.drop p{color:var(--muted);margin:8px 0 0}.drop strong{color:var(--text);font-size:14px}.preview{max-width:100%;max-height:190px;border-radius:6px;display:none}.message{width:100%;margin-top:15px;resize:vertical;min-height:86px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);padding:12px;font:inherit;outline:0}.message:focus{border-color:var(--lime)}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:15px}.status{color:var(--muted);min-height:20px}.status.ok{color:var(--cyan)}.status.error{color:var(--red)}button.primary{border:0;border-radius:7px;padding:11px 17px;background:var(--lime);color:var(--limeInk);font-weight:700;cursor:pointer}button.primary:disabled{opacity:.5;cursor:wait}.answer{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;white-space:pre-wrap;line-height:1.7;color:#d5dfd7}.empty{color:var(--muted);padding:28px 0;text-align:center}@media(max-width:720px){.app{grid-template-columns:1fr}.side{position:static;border-right:0;border-bottom:1px solid var(--line);padding:15px}.brand{margin-bottom:15px}.nav-title,.side-foot{display:none}.nav{display:none}.nav.active{display:flex}.main{width:calc(100% - 28px);padding:30px 0}.top{display:block}.model-select{margin-top:18px;width:100%}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><i>✦</i>AuraBrain</div><div class="nav-title">Workspace</div><button class="nav active"><span>◌</span>模型测试</button><div class="nav-title">Settings</div><button class="nav" onclick="location.href='/settings/models'"><span>⚙</span>模型管理</button><button class="nav" onclick="location.href='/setup'"><span>?</span>初始化引导</button><div class="side-foot">Local Runtime · 49000</div></aside><main class="main"><header class="top"><div><div class="eyebrow">Model playground</div><h1>模型测试</h1><p>发送一句话，或加入一张图片，确认当前模型已经准备好。</p></div><select class="model-select" id="model"></select></header><section class="card"><h2>开始一次测试</h2><p class="desc">图片可以直接从 Windows 剪贴板粘贴，也可以拖到下面的区域。模型必须支持视觉能力才能理解图片。</p><div class="drop" id="drop"><div id="drop-copy"><strong>拖拽图片到这里，或直接 Ctrl + V</strong><p>支持 PNG、JPEG、WEBP · 图片只发送给当前模型</p></div><img class="preview" id="preview" alt="待发送图片"><input id="file" type="file" accept="image/*" hidden></div><textarea class="message" id="message" placeholder="输入一条测试消息，例如：请总结这张图片"></textarea><div class="actions"><div class="status" id="status"></div><button class="primary" id="send">发送测试</button></div><div class="answer" id="answer" hidden></div></section></main></div>
<script>
const model=document.getElementById('model'),drop=document.getElementById('drop'),file=document.getElementById('file'),preview=document.getElementById('preview'),copy=document.getElementById('drop-copy'),message=document.getElementById('message'),send=document.getElementById('send'),status=document.getElementById('status'),answer=document.getElementById('answer');let imageData='';
function setImage(blob){const reader=new FileReader();reader.onload=()=>{imageData=reader.result;preview.src=imageData;preview.style.display='block';copy.style.display='none';drop.classList.add('has-image')};reader.readAsDataURL(blob)}
drop.addEventListener('click',()=>file.click());file.addEventListener('change',()=>file.files[0]&&setImage(file.files[0]));['dragenter','dragover'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>e.dataTransfer.files[0]&&setImage(e.dataTransfer.files[0]));document.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(item=>item.type.startsWith('image/'));if(item)setImage(item.getAsFile())});
async function load(){const response=await fetch('/admin/status');const data=await response.json();for(const provider of data.providers||[])for(const item of provider.models||[]){const option=document.createElement('option');option.value=provider.id+'/'+item.id;option.textContent=provider.name+' · '+item.name;model.append(option)}if(data.defaultModel)model.value=data.defaultModel;if(!model.options.length)status.textContent='还没有可用模型，请先打开模型管理。'}
send.addEventListener('click',async()=>{if(!message.value.trim())return status.textContent='请先输入测试消息';send.disabled=true;status.className='status';status.textContent='正在请求模型…';answer.hidden=true;try{const response=await fetch('/admin/model-chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:model.value,message:message.value,imageData:imageData||undefined})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'请求失败');answer.textContent=data.text||'模型没有返回文本';answer.hidden=false;status.className='status ok';status.textContent='测试完成'}catch(error){status.className='status error';status.textContent=error.message||String(error)}finally{send.disabled=false}});load().catch(error=>status.textContent=error.message||String(error));
</script></body></html>
